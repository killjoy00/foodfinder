name: Regenerate Expo iOS 27 lockfile (temporary)
on:
  push:
    branches: ['chore/ios27-sdk-readiness-20261118']
    paths:
      - '.github/workflows/ios27-lockfile-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    if: github.ref == 'refs/heads/chore/ios27-sdk-readiness-20261118'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Resolve updated Expo native dependencies
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save dependency lockfile to working branch
        run: |
          set -euo pipefail
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches dependencies'
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(ios): refresh Expo 57 lockfile for Xcode 27"
          git push origin HEAD:chore/ios27-sdk-readiness-20261118
      - name: Validate clean install of frozen dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
